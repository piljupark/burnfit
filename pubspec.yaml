name: pt_solution_v2
description: PT Solution V2 - Fitness Center Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.6.2

  # State Management
  provider: ^6.1.2

  # UI
  gap: ^3.0.1
  cached_network_image: ^3.3.1

  # Image
  image_picker: ^1.0.7
  flutter_image_compress: ^2.2.0

  # Icons (Phosphor Light/Fill)
  phosphor_icons: ^3.0.1

  # Utils
  intl: ^0.20.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: WantedSans
      fonts:
        - asset: assets/fonts/WantedSans-Regular.otf
          weight: 400
        - asset: assets/fonts/WantedSans-Medium.otf
          weight: 500
        - asset: assets/fonts/WantedSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/WantedSans-Bold.otf
          weight: 700
        - asset: assets/fonts/WantedSans-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/WantedSans-Black.otf
          weight: 900
