/* 배치: 세 안을 열로 — 큰 아이콘 → 어두운·밝은 홈 화면 크기 → 작은 크기 */
:root { --bg: #F3F3F5; --card: #FFFFFF; --ink: #191919; --body: #4A4A4A; --mute: #6B6B70; --line: #E4E4E8; --accent: #FF7A33; --sans: "WantedSans", "Apple SD Gothic Neo", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141416; --card: #1B1C1F; --ink: #FFFFFF; --body: #DADBDF; --mute: #8A8E94; --line: #2A2C30; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #141416; --card: #1B1C1F; --ink: #FFFFFF; --body: #DADBDF; --mute: #8A8E94; --line: #2A2C30; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; letter-spacing: -0.019em; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 64px; }
h1 { font-size: 28px; line-height: 34px; font-weight: 500; margin: 0; }
.lead { color: var(--body); margin: 8px 0 0; max-width: 64ch; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.col.rec { box-shadow: inset 0 0 0 2px var(--ink); border-color: var(--ink); }
.big { width: 100%; max-width: 280px; aspect-ratio: 1; border-radius: 22.37%; display: block; margin: 0 auto; }
.col h2 { margin: 0; font-size: 17px; font-weight: 700; }
.col h2 span { font-size: 11px; font-weight: 700; color: #A8400E; background: #FFF1E8; padding: 1px 7px; border-radius: 9999px; margin-left: 6px; vertical-align: 3px; }
.col p { margin: 4px 0 0; color: var(--body); font-size: 14px; line-height: 21px; }
.walls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wall { border-radius: 16px; padding: 16px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wall.dark { background: #1E2533; }
.wall.light { background: #E6E9F2; }
.wall img { width: 60px; height: 60px; border-radius: 13.4px; display: block; }
.wall span { font-size: 11px; color: #FFFFFF; }
.wall.light span { color: #191919; }
.small { display: flex; gap: 14px; align-items: flex-end; justify-content: center; }
.small img { display: block; border-radius: 22.37%; }
.small figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--mute); }
</style>

<div class="wrap">
  <h1>아이콘 안쪽 점 색</h1>
  <p class="lead">'기울인 아령' 안을 채운 작은 점을 회색에서 앱 강조색 주황(#FF7A33)으로 바꾼 두 가지를 지금 모습과 나란히 놓았어요. 모서리의 밝은 점과 이은 선은 세 가지 모두 흰색 그대로예요. 아래는 실제 홈 화면 크기(60)와 알림 크기(40·29)예요.</p>
  <div class="cols" id="cols"></div>
</div>

<script>
(function () {
  const OPTS = [
    { f: 'img/opt-white-512.png', name: '지금 (회색 점)', desc: '아령 안을 채운 점이 회색. 모티브(sharing-gallery)와 같은 무채색이라 가장 차분해요.' },
    { f: 'img/opt-in-soft-512.png', name: '안쪽 점 주황 (은은하게)', desc: '안을 채운 점만 주황, 모서리의 흰 점과 흰 선은 그대로. 크게 보면 따뜻하지만, 홈 화면 크기(60) 이하에서는 주황이 갈색처럼 탁해 보여요.' },
    { f: 'img/opt-in-strong-512.png', name: '안쪽 점 주황 (진하게)', rec: true, desc: '같은 구성에서 주황을 진하게. 작은 크기에서도 앱 강조색 주황이 그대로 살아나 홈 화면에서 가장 눈에 띄어요. 흰 별자리 윤곽은 대비가 조금 줄지만 모양은 그대로 읽혀요.' }
  ];
  document.getElementById('cols').innerHTML = OPTS.map(o => `
    <section class="col${o.rec ? ' rec' : ''}">
      <img class="big" src="${o.f}" alt="${o.name} 아이콘">
      <div><h2>${o.name}${o.rec ? '<span>추천</span>' : ''}</h2><p>${o.desc}</p></div>
      <div class="walls">
        <div class="wall dark"><img src="${o.f}" alt=""><span>REFIT</span></div>
        <div class="wall light"><img src="${o.f}" alt=""><span>REFIT</span></div>
      </div>
      <div class="small">${[60, 40, 29].map(s => `<figure><img src="${o.f}" alt="" width="${s}" height="${s}"><figcaption>${s}</figcaption></figure>`).join('')}</div>
    </section>`).join('');
})();
</script>
