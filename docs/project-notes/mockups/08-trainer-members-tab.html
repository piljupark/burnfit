/* 배치: 머리(테마) → 화면 고르기 → 휴대폰(눌러 보기) + 설명 → 상태 모음 */
:root {
  --page: #F3F3F5; --page-ink: #191919; --page-body: #4A4A4A; --page-mute: #6B6B70; --page-line: #E4E4E8; --page-card: #FFFFFF;
  --canvas: #FFFFFF; --canvasCard: #F6F6F7; --canvasSoft: #F3F3F5; --canvasMid: #D4D4D8; --hairline: #F0F0F2;
  --ink: #191919; --body: #4A4A4A; --mute: #6B6B70; --faint: #9A9AA0; --chevron: #B0B0B5;
  --primary: #FF7A33; --noticeBg: #FFF1E8; --noticeText: #A8400E; --frame: #191919; --backdrop: rgba(0,0,0,.4);
  --sans: "WantedSans", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #141416; --page-ink: #FFFFFF; --page-body: #DADBDF; --page-mute: #8A8E94; --page-line: #26282C; --page-card: #1B1C1F;
    --canvas: #0A0A0A; --canvasCard: #191919; --canvasSoft: #1A1C20; --canvasMid: #363A3F; --hairline: #212327;
    --ink: #FFFFFF; --body: #DADBDF; --mute: #7D8187; --faint: #5E6268; --chevron: #4A4D52; --frame: #34363B;
    --noticeBg: #3A2416; --noticeText: #FFB088; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #141416; --page-ink: #FFFFFF; --page-body: #DADBDF; --page-mute: #8A8E94; --page-line: #26282C; --page-card: #1B1C1F;
  --canvas: #0A0A0A; --canvasCard: #191919; --canvasSoft: #1A1C20; --canvasMid: #363A3F; --hairline: #212327;
  --ink: #FFFFFF; --body: #DADBDF; --mute: #7D8187; --faint: #5E6268; --chevron: #4A4D52; --frame: #34363B;
  --noticeBg: #3A2416; --noticeText: #FFB088; color-scheme: dark;
}
.phone.force-light { --canvas: #FFFFFF; --canvasCard: #F6F6F7; --canvasSoft: #F3F3F5; --canvasMid: #D4D4D8; --hairline: #F0F0F2; --ink: #191919; --body: #4A4A4A; --mute: #6B6B70; --faint: #9A9AA0; --chevron: #B0B0B5; --frame: #191919; --noticeBg: #FFF1E8; --noticeText: #A8400E; }
.phone.force-dark { --canvas: #0A0A0A; --canvasCard: #191919; --canvasSoft: #1A1C20; --canvasMid: #363A3F; --hairline: #212327; --ink: #FFFFFF; --body: #DADBDF; --mute: #7D8187; --faint: #5E6268; --chevron: #4A4D52; --frame: #34363B; --noticeBg: #3A2416; --noticeText: #FFB088; }

* { box-sizing: border-box; }
body { background: var(--page); color: var(--page-ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; letter-spacing: -0.019em; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 40px 20px 64px; }
button, input { font-family: inherit; letter-spacing: inherit; }
.wrap button:focus-visible, .wrap input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
.head h1 { font-size: 28px; line-height: 34px; font-weight: 500; margin: 0; }
.head p { margin: 8px 0 0; color: var(--page-body); max-width: 62ch; }
.seg-mini { display: inline-flex; background: var(--page-card); border: 1px solid var(--page-line); border-radius: 9999px; padding: 3px; }
.seg-mini button { font-size: 14px; line-height: 20px; border: 0; background: transparent; color: var(--page-body); padding: 8px 14px; border-radius: 9999px; cursor: pointer; }
.seg-mini button[aria-pressed="true"] { background: var(--page-ink); color: var(--page); font-weight: 500; }

.vtabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 28px; }
@media (max-width: 900px) { .vtabs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 600px) { .vtabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.vtab { display: grid; gap: 2px; align-content: start; text-align: left; padding: 14px 16px; min-height: 72px; background: var(--page-card); border: 1px solid var(--page-line); border-radius: 18px; color: var(--page-ink); cursor: pointer; }
.vtab small { font-size: 13px; line-height: 18px; color: var(--page-mute); }
.vtab b { font-size: 16px; line-height: 22px; font-weight: 500; }
.vtab[aria-pressed="true"] { border-color: var(--page-ink); box-shadow: inset 0 0 0 1px var(--page-ink); }

.stage { display: grid; grid-template-columns: 375px minmax(0, 1fr); gap: 48px; margin-top: 28px; align-items: start; }
@media (max-width: 880px) { .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 32px; } }
.stage-phone { display: grid; gap: 12px; justify-items: center; width: min(375px, 100%); }
.demo-note { font-size: 13px; line-height: 19px; color: var(--page-mute); text-align: center; margin: 0; max-width: 38ch; }

.notes { min-width: 0; width: 100%; }
.notes .kicker { font-size: 13px; color: var(--page-mute); margin: 0; }
.notes h2 { font-size: 22px; line-height: 28px; font-weight: 500; margin: 2px 0 0; }
.notes .summary { color: var(--page-body); margin: 8px 0 0; max-width: 62ch; }
.notes h3.sec { font-size: 15px; font-weight: 700; margin: 28px 0 0; }
.change { list-style: none; margin: 8px 0 0; padding: 0; display: grid; }
.change li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding-block: 14px; border-top: 1px solid var(--page-line); }
.change li:first-child { border-top: 0; }
.num { width: 24px; height: 24px; border-radius: 9999px; background: var(--primary); color: #191919; font-size: 13px; line-height: 24px; font-weight: 700; text-align: center; }
.change h4 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
.change p { margin: 4px 0 0; color: var(--page-body); font-size: 14px; line-height: 21px; }
.table-scroll { overflow-x: auto; margin-top: 10px; background: var(--page-card); border-radius: 18px; border: 1px solid var(--page-line); }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; line-height: 21px; }
th, td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--page-line); vertical-align: top; }
th { color: var(--page-mute); font-weight: 500; border-top: 0; }
td:first-child { white-space: nowrap; font-weight: 500; }
.ask { margin-top: 10px; display: grid; gap: 8px; }
.ask div { background: var(--page-card); border: 1px solid var(--page-line); border-radius: 18px; padding: 14px 16px; font-size: 14px; line-height: 21px; color: var(--page-body); }
.ask b { color: var(--page-ink); font-weight: 500; }

.states { margin-top: 56px; }
.states h2 { font-size: 22px; font-weight: 500; margin: 0; }
.states > p { color: var(--page-body); margin: 6px 0 0; }
.state-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 32px 20px; margin-top: 20px; justify-items: center; }
.mini { margin: 0; display: grid; gap: 10px; justify-items: center; }
.mini-box { width: 232px; height: 502px; overflow: hidden; }
.mini-box .phone { transform: scale(.6187); transform-origin: top left; }
.mini figcaption { font-size: 14px; font-weight: 500; text-align: center; }
.mini figcaption span { display: block; font-size: 12px; font-weight: 400; color: var(--page-mute); }

/* ── 휴대폰 ── */
.phone { width: 375px; height: 812px; border-radius: 48px; border: 10px solid var(--frame); background: var(--canvas); color: var(--ink); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 112px; height: 32px; border-radius: 20px; background: #000; z-index: 9; }
.status { height: 47px; flex: none; display: grid; grid-template-columns: 1fr 112px 1fr; align-items: center; padding-top: 4px; }
.status .time { justify-self: center; font-size: 15px; font-weight: 700; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

.hero { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 0; height: 52px; }
.hero h3 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 500; }
.hero h3 span { font-size: 17px; color: var(--mute); font-weight: 500; margin-left: 6px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); background: none; border: 0; margin-right: -10px; }

    { name: '김민지', pt: 7, last: '3일 전 운동', meals: 3, goal: true },
    { name: '이서준', pt: 2, last: '오늘 운동', meals: 0, goal: false, soon: true },
    { name: '박하늘', pt: null, last: '기록 없음', meals: 0, goal: false, isNew: true },
    { name: '최유나', pt: 12, last: '어제 운동', meals: 1, goal: true },
    { name: '정도윤', pt: 5, last: '5일 전 운동', meals: 0, goal: false, endSoon: 'D-9' },
    { name: '한지우', pt: 18, last: '2주 넘게 운동 없음', meals: 0, goal: true, idle: true },
    { name: '오세린', pt: 9, last: '오늘 운동', meals: 2, goal: true },
    { name: '윤태호', pt: 1, last: '어제 운동', meals: 0, goal: true, soon: true },
    { name: '서다은', pt: 14, last: '4일 전 운동', meals: 0, goal: false },
    { name: '강준혁', pt: 10, last: '어제 운동', meals: 0, goal: true },
    { name: '임하린', pt: 6, last: '6일 전 운동', meals: 0, goal: true },
    { name: '신우진', pt: 20, last: '오늘 운동', meals: 0, goal: true }
  ];
  const needs = m => m.meals > 0 || !!m.isNew;
  const soon = m => !!m.soon || !!m.endSoon;
  const FILTERS = [
    { key: 'all', label: '전체', test: () => true },
    { key: 'needs', label: '확인 필요', test: needs },
    { key: 'soon', label: 'PT 곧 끝남', test: soon },
    { key: 'goal', label: '목표 없음', test: m => !m.goal }
  ];
  const sortRows = list => [...list].sort((a, b) => (Number(needs(b)) - Number(needs(a))) || a.name.localeCompare(b.name, 'ko'));

  function subLine(m) {
    const parts = [];
    if (m.pt == null) parts.push('PT 없음');
    else parts.push(m.pt <= 3 ? `<span class="warn">PT ${m.pt}회 남음</span>` : `PT ${m.pt}회 남음`);
    if (m.endSoon) parts.push(`<span class="warn">기간 ${m.endSoon}</span>`);
    parts.push(m.idle ? `<span class="warn">${m.last}</span>` : m.last);
    if (!m.goal) parts.push('<span class="warn">목표 없음</span>');
    return parts.join(' · ');
  }
  const row = m => `<button type="button" class="row" data-open="${esc(m.name)}" aria-label="${esc(m.name)}${m.meals ? `, 피드백할 식단 ${m.meals}개` : ''}">
      <span class="avatar" aria-hidden="true">${esc(m.name.slice(0, 1))}</span>
      <span class="tx"><span class="name">${esc(m.name)}${m.isNew ? '<span class="tag">새 회원</span>' : ''}</span><span class="sub">${subLine(m)}</span></span>
      ${m.meals ? `<span class="badge" aria-hidden="true">${m.meals}</span>` : ''}${I.chev}
    </button>`;
  const status = '<div class="island"></div><div class="status"><span></span><span class="time">9:41</span><span></span></div>';
  const nav = (on, dot) => `<div class="nav" aria-hidden="true">${['홈', '일정', '회원', '식단', '마이'].map(n => `<span class="${n === on ? 'on' : ''}">${NAV_ICON[n]}${n}${dot && n === '회원' ? '<i class="dot"></i>' : ''}${n === '식단' ? '<i class="dot"></i>' : ''}</span>`).join('')}</div>`;

  function membersScreen(s) {
    const q = s.q.trim();
    const f = FILTERS.find(x => x.key === s.filter);
    let body;
    if (s.mode === 'loading') {
      body = Array.from({ length: 6 }, () => `<div class="row" aria-hidden="true"><span class="avatar"></span><span class="tx"><span style="height:14px;width:90px;border-radius:6px;background:var(--canvasCard)"></span><span style="height:12px;width:170px;border-radius:6px;background:var(--canvasCard)"></span></span></div>`).join('');
    } else if (s.mode === 'none') {
      body = `<div class="empty"><div class="ico">${I.users}</div>아직 담당 회원이 없어요.<br>관리자가 배정하면 여기에 보여요.</div>`;
    } else {
      const list = sortRows(MEMBERS.filter(m => f.test(m) && (!q || m.name.includes(q))));
      body = list.length
        ? `<div class="sec-head"><span>${q ? `'${esc(q)}' 찾은 회원` : f.label}</span><span>${list.length}명</span></div>${list.map(row).join('')}`
        : `<div class="empty"><div class="ico">${I.search}</div>'${esc(q)}'에 맞는 회원이 없어요.</div>`;
    }
    const counts = Object.fromEntries(FILTERS.map(x => [x.key, MEMBERS.filter(x.test).length]));
    return `<div class="screen">${status}
      <div class="scroll">
        <div class="hero"><h3>회원<span>${s.mode === 'none' ? 0 : MEMBERS.length}</span></h3><button type="button" class="icon-btn" aria-label="알림">${I.bell}</button></div>
        <label class="search">${I.search}<input type="search" placeholder="이름으로 찾기" value="${esc(s.q)}" aria-label="회원 이름 검색" data-q>${s.q ? `<button type="button" class="clear" data-clear aria-label="지우기">${I.x}</button>` : ''}</label>
        <div class="chips" role="group" aria-label="회원 고르기">${FILTERS.map(x => `<button type="button" class="chip" data-filter="${x.key}" aria-pressed="${x.key === s.filter}">${x.label} <i>${s.mode === 'none' ? 0 : counts[x.key]}</i></button>`).join('')}</div>
        ${body}
      </div>
      ${nav('회원', s.navDot)}
      <div class="detail${s.open ? ' open' : ''}" aria-hidden="${!s.open}">
        <div class="bar"><button type="button" class="icon-btn" style="margin:0" data-close aria-label="뒤로">${I.back}</button><h4></h4><button type="button" class="icon-btn" style="margin:0" aria-label="더보기">${I.more}</button></div>
        <div class="d-name">${esc(s.open || '')}</div>
        <div class="d-sub">여성 · 28세 · 165cm</div>
        <div class="d-cards"><div>PT 남은 횟수<b>7회</b></div><div>최근 체중<b>58.2kg</b></div></div>
        <div class="d-tabs"><span>운동</span><span class="on">식단</span><span>유산소</span><span>정보</span></div>
        <div class="d-note">지금 있는 회원 상세 화면이에요. 목록에서 들어오면 '확인 필요' 이유에 맞는 탭으로 바로 열어요 — 피드백할 식단이 있으면 식단 탭, 아니면 운동 탭.</div>
      </div>
    </div>`;
  }

  function feedScreen() {
    return `<div class="screen">${status}<div class="scroll">
      <div class="hero"><h3>식단</h3><button type="button" class="icon-btn" aria-label="알림">${I.bell}</button></div>
      <div class="chips"><span class="chip" aria-pressed="true" style="background:var(--ink);color:var(--canvas);font-weight:500">전체</span><span class="chip">김민지 <i>3</i></span><span class="chip">오세린 <i>2</i></span></div>
      <div class="sec-head"><span>오늘 · 3건</span></div>
      <div class="card"><div class="who"><span class="avatar" style="width:32px;height:32px;font-size:13px">김</span><span><b class="linkname">김민지</b><br><small>점심 · 12:40 · 피드백 전</small></span></div><div class="photo"></div></div>
      <div class="hint">밑줄 친 회원 이름을 누르면 그 회원 상세로 가요. 카드의 나머지 자리는 지금처럼 사진 넘김 · 피드백 입력이에요.</div>
    </div>${nav('식단')}</div>`;
  }

  function ptScreen() {
    return `<div class="screen">${status}<div class="scroll">
      <div class="bar"><button type="button" class="icon-btn" style="margin:0" aria-label="뒤로">${I.back}</button><h4>PT 기록</h4><span style="justify-self:end;font-size:15px;font-weight:700;padding-right:8px">저장</span></div>
      <div class="ptbar"><span class="avatar">김</span><span class="tx"><b class="linkname">김민지</b><small>오늘 10:00 · 50분</small></span>${I.chev}</div>
      <div class="hint">지금 회원 이름 줄은 보기만 하는 줄이에요. 누르면 회원 상세로 가게 바꿔요 (화살표 추가).</div>
      <div class="card"><b style="font-size:17px;font-weight:500">바벨 스쿼트</b><br><small>하체 · 지난 PT 대비 최고 +5kg</small><div style="height:120px"></div></div>
    </div></div>`;
  }

  // 추천 계산 — 앱(NutritionRecommendation)과 같다. 기초대사량이 없어 체중 × 30.
  const WEIGHT = 80;
  function recommend(goal) {
    const r = (v, step) => Math.round(v / step) * step;
    const tdee = WEIGHT * 30;
    const kcal = r(Math.max(1200, goal === 'lose' ? tdee - 500 : goal === 'gain' ? tdee + 300 : tdee), 50);
    const protein = r(WEIGHT * (goal === 'lose' ? 2.0 : goal === 'gain' ? 1.8 : 1.6), 5);
    const fat = r(kcal * 0.25 / 9, 5);
    const carbs = r(Math.max(0, (kcal - protein * 4 - fat * 9) / 4), 5);
    return { kcal, carbs, protein, fat };
  }
  const fmt = n => n === '' || n == null ? '' : Number(n).toLocaleString('ko-KR');

  // ── 식단 탭 ──
  const PLANS = {
    '김민지': { kcal: '2,450', protein: 130, guides: { 점심: '단백질 손바닥 1개 + 밥 2/3 공기', 저녁: '밥 반 공기, 채소 두 주먹' } },
    '최유나': { kcal: '1,800', protein: 110, guides: { 아침: '달걀 2개 + 바나나' } },
    '오세린': null
  };
  const MEALS = [
    { who: '김민지', meal: '점심', time: '12:40', memo: '닭가슴살 샐러드랑 현미밥 반 공기', todo: true },
    { who: '오세린', meal: '점심', time: '12:10', memo: '김치찌개, 공깃밥', todo: true },
    { who: '최유나', meal: '아침', time: '08:20', memo: '', todo: true },
    { who: '김민지', meal: '아침', time: '07:50', memo: '그릭요거트', todo: false }
  ];
  const fd = { member: '김민지' };
  const OLD_PHRASES = ['단백질 좋아요', '채소를 조금 더', '양 적당해요'];
  const GOAL_PHRASES = ['가이드대로 잘 드셨어요', '단백질을 조금 더', '탄수화물이 많아요', '양 적당해요'];

  function feedCard(m, improved, showWho) {
    const plan = PLANS[m.who];
    const guide = improved && plan && plan.guides[m.meal];
    const phrases = improved && plan ? GOAL_PHRASES : OLD_PHRASES;
    return `<div class="fcard">
      <div class="who">${showWho ? `<span class="avatar" style="width:36px;height:36px;font-size:14px">${m.who[0]}</span>` : ''}
        <span class="tx"><b>${showWho ? m.who : m.meal}</b><small>${showWho ? `${m.meal} · ` : ''}${m.time}</small></span>
        <span class="st">${m.todo ? '피드백 전' : '보냄'}</span></div>
      <div class="ph"></div>
      ${guide ? `<div class="guide new-mark"><em>${m.meal} 가이드</em>${guide}</div>` : ''}
      ${m.memo ? `<div class="memo">${m.memo}</div>` : ''}
      ${m.todo ? `<div class="qp${improved && plan ? ' new-mark' : ''}" style="${improved && plan ? 'margin:0 20px;padding:10px 0 0' : ''}">${phrases.map(p => `<span class="${improved && plan && p !== '양 적당해요' ? 'goal' : ''}">${p}</span>`).join('')}</div>
      <div class="inp">피드백 남기기<i></i></div>` : ''}
    </div>`;
  }

  function feedScreenV(improved) {
    const counts = {};
    MEALS.forEach(m => { if (m.todo) counts[m.who] = (counts[m.who] || 0) + 1; });
    const sel = improved ? fd.member : 'all';
    const list = MEALS.filter(m => sel === 'all' || m.who === sel);
    const plan = sel !== 'all' ? PLANS[sel] : undefined;
    let bar = '';
    if (improved && sel !== 'all') {
      bar = plan
        ? `<div class="goalbar new-mark"><div class="top"><b>목표 ${plan.kcal}kcal · 단백질 ${plan.protein}g</b><button type="button" class="edit">고치기 ${I.chev}</button></div>
            ${Object.entries(plan.guides).map(([k, v]) => `<div class="g"><em>${k}</em>${v}</div>`).join('')}</div>`
        : `<div class="goalbar none new-mark"><span>${sel}님은 식단 목표가 없어요</span><button type="button">정하기</button></div>`;
    }
    return `<div class="screen">${status}<div class="scroll">
      <div class="hero"><h3>식단</h3><button type="button" class="icon-btn" aria-label="알림">${I.bell}</button></div>
      <div class="fchips" role="group" aria-label="회원">
        <button type="button" class="fchip" data-fmember="all" aria-pressed="${sel === 'all'}">전체</button>
        ${Object.keys(PLANS).map(n => `<button type="button" class="fchip" data-fmember="${n}" aria-pressed="${sel === n}">${n}${counts[n] ? ` <i>${counts[n]}</i>` : ''}</button>`).join('')}
      </div>
      ${bar}
      <div class="fday">오늘<span>· ${list.length}건</span></div>
      ${list.map(m => feedCard(m, improved, sel === 'all')).join('')}
    </div>${nav('식단')}</div>`;
  }

  function npOldScreen() {
    return `<div class="screen">${status}<div class="scroll"><div class="np-wrap">
      <div class="bar" style="padding:0;margin:0 -8px"><button type="button" class="icon-btn" style="margin:0" aria-label="뒤로">${I.back}</button><h4>식단 목표</h4><span></span></div>
      <div class="np-name">유저1님</div>
      <p class="np-desc">정한 목표는 회원의 식단 화면 맨 위에 보이고, 저장하면 알림이 가요.</p>
      <div class="np-card"><h6>추천으로 시작하기</h6>
        <div class="np-goals mark"><span>감량</span><span class="on">유지</span><span>증량</span></div>
        <p class="np-basis">체중 80kg × 30 (유지)<br>→ 2400kcal · 탄수 325g · 단백질 130g · 지방 65g</p>
        <div class="np-fill mark">추천값 채우기</div>
      </div>
      <div class="np-sec">하루 권장</div>
      <div class="np-grid mark">
        <div class="np-field"><small>칼로리</small><div>비워 둘 수 있...<em>kcal</em></div></div>
        <div class="np-field"><small>탄수화물</small><div>비워 둘 수 있어요<em>g</em></div></div>
        <div class="np-field"><small>단백질</small><div>비워 둘 수 있어요<em>g</em></div></div>
        <div class="np-field"><small>지방</small><div>비워 둘 수 있어요<em>g</em></div></div>
      </div>
      <div class="np-sec">끼니별 가이드</div>
      <p class="np-desc">적은 끼니만 회원에게 보여요.</p>
      <div class="np-field" style="margin-top:14px"><small>아침</small><div>예: 달걀 2개 + 바나나 1개</div></div>
    </div></div><div class="np-save"><span>저장</span></div></div>`;
  }

  function npNewScreen(p) {
    const seg = [['lose', '감량'], ['keep', '유지'], ['gain', '증량'], ['self', '직접']];
    const basis = p.goal === 'self'
      ? '직접 정한 값이에요. 위에서 고르면 추천값으로 바뀌어요.'
      : `체중 ${WEIGHT}kg 기준 추천 · 숫자를 고치면 '직접'으로 바뀌어요`;
    return `<div class="screen">${status}<div class="scroll">
      <div class="bar"><button type="button" class="icon-btn" style="margin:0" aria-label="뒤로">${I.back}</button><h4>식단 목표</h4><button type="button" class="icon-btn" style="margin:0" data-npmenu aria-label="더보기">${I.more}</button></div>
      <div class="ng-name">유저1님</div>
      <div class="ng-head"><h6>하루 목표</h6><small>비워 두면 회원에게 안 보여요</small></div>
      <div class="seg" role="group" aria-label="목표">${seg.map(([k, l]) => `<button type="button" data-goal="${k}" aria-pressed="${p.goal === k}">${l}</button>`).join('')}</div>
      <div class="ng-kcal"><label for="ng-kcal">칼로리</label><input id="ng-kcal" inputmode="numeric" placeholder="–" data-num="kcal" value="${fmt(p.kcal)}"><em>kcal</em></div>
      <div class="ng-macros">
        ${[['carbs', '탄수화물'], ['protein', '단백질'], ['fat', '지방']].map(([k, l]) => `<div class="ng-macro"><label for="ng-${k}">${l}</label><span><input id="ng-${k}" inputmode="numeric" placeholder="–" data-num="${k}" value="${fmt(p[k])}"><em>g</em></span></div>`).join('')}
      </div>
      <p class="ng-basis" data-basis>${basis}</p>
      <div class="ng-head"><h6>끼니별 가이드</h6><small>적은 끼니만 보여요</small></div>
      <div class="ng-guides">
        ${[['아침', '달걀 2개 + 바나나'], ['점심', '단백질 손바닥 1개 + 밥 2/3'], ['간식', '그릭요거트'], ['저녁', '밥 반 공기, 채소 두 주먹']].map(([m, h]) => `<label class="ng-guide"><b>${m}</b><input placeholder="${h}"></label>`).join('')}
      </div>
      <div class="ng-head"><h6>트레이너 한마디</h6></div>
      <textarea class="ng-note" placeholder="예: 저녁 탄수화물을 줄이고, 물을 하루 2L 마셔요"></textarea>
    </div><div class="np-save"><span>저장</span></div>
    ${p.menu ? '<div class="ng-menu"><span>목표 지우기</span></div>' : ''}</div>`;
  }

  function scheduleScreen() {
    return `<div class="screen">${status}<div class="scroll">
      <div class="hero"><h3>일정</h3><button type="button" class="icon-btn" aria-label="알림">${I.bell}</button></div>
      <div class="tline"><span>10:00</span></div>
      <div class="block"><span><b style="font-weight:500">김민지</b> · PT 50분</span>${I.more}</div>
      <div class="tline"><span>11:00</span></div>
      <div class="block" style="border-style:dashed;opacity:.6"><span>이서준 · PT 50분</span>${I.more}</div>
    </div>${nav('일정')}
    <div class="dim"></div>
    <div class="sheet"><div class="handle"></div><h5>김민지 · 10:00</h5>
      <div class="act new"><span class="ib">${I.user}</span>회원 정보</div>
      <div class="act"><span class="ib">${I.cal}</span>예약 수정</div>
      <div class="act"><span class="ib">${I.x2}</span>예약 취소</div>
    </div></div>`;
  }

  const VIEWS = [
    { key: 'list', small: '새 탭', title: '회원 목록', note: '검색 · 알약 · 회원 줄을 눌러 보세요. 줄을 누르면 회원 상세가 열려요.' },
    { key: 'needs', small: '알약', title: '확인 필요', note: '피드백할 식단이 있거나 새로 배정된 회원만. 탭 점은 이 회원이 있을 때.' },
    { key: 'feed', small: '이름 누르기', title: '식단 피드', note: '카드의 회원 이름 → 회원 상세.' },

    { cap: '불러오는 중', note: '회색 줄 6개', html: membersScreen({ q: '', filter: 'all', open: null, mode: 'loading' }) },
    { cap: '담당 회원 없음', note: '관리자 배정 안내', html: membersScreen({ q: '', filter: 'all', open: null, mode: 'none' }) },
    { cap: '검색 결과 없음', note: "'김철수'", html: membersScreen({ q: '김철수', filter: 'all', open: null, mode: 'ok' }) },
    { cap: '다크 · 확인 필요', note: '알약을 고른 상태', html: membersScreen({ q: '', filter: 'needs', open: null, mode: 'ok' }), theme: 'dark' }
  ];
  const grid = document.getElementById('states');
  SAMPLES.forEach(s => {
    const fig = document.createElement('figure'); fig.className = 'mini';
    const box = document.createElement('div'); box.className = 'mini-box';
    const p = makePhone(s.html, s.theme); p.setAttribute('aria-hidden', 'true'); p.setAttribute('inert', '');
    box.appendChild(p);
    const cap = document.createElement('figcaption'); cap.innerHTML = `${esc(s.cap)}<span>${esc(s.note)}</span>`;
    fig.append(box, cap); grid.appendChild(fig);
  });

  const btns = { '': 'th-auto', light: 'th-light', dark: 'th-dark' };
  Object.entries(btns).forEach(([k, id]) => document.getElementById(id).addEventListener('click', () => {
    Object.values(btns).forEach(b => document.getElementById(b).setAttribute('aria-pressed', b === id));
    theme = k;
    if (k) document.documentElement.setAttribute('data-theme', k); else document.documentElement.removeAttribute('data-theme');
    draw();
  }));
})();
</script>
</body></html>
